<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Library · 本机产品界面库</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#fff; --line:#ebebed; --text:#1a1a1c; --muted:#8b8b90;
  --soft:#f0f0f2; --accent:#14b8a6; --radius:16px; --shadow:0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121214; --panel:#1c1c1e; --line:#2a2a2e; --text:#ececef; --muted:#8e8e93; --soft:#252528; --shadow:none}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex}
aside{width:240px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100vh}
.brand{padding:20px 18px 12px}
.brand .mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#6366f1);margin-bottom:12px}
.brand b{font-size:15px;display:block}
.brand small{color:var(--muted);font-size:12px;font-weight:400}
.apps{padding:8px;overflow:auto;flex:1}
.app{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.app:hover{background:var(--soft)}
.app.on{background:var(--soft);border-color:var(--line)}
.app .av{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.app .av.gb{background:linear-gradient(135deg,#14b8a6,#0d9488)}
.app .av.cx{background:linear-gradient(135deg,#111827,#374151)}
.app .meta{min-width:0;flex:1}
.app .meta b{display:block;font-size:14px}
.app .meta span{color:var(--muted);font-size:12px}
.badge{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11.5px;color:var(--muted)}
.foot{padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
main{flex:1;min-width:0;height:100vh;overflow:auto}
.view{padding:24px 28px 40px;max-width:1280px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0 0 4px;font-weight:650}
.top .sub{color:var(--muted);font-size:13px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--text);color:var(--panel);border-color:var(--text)}
.search{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px;font:inherit;min-width:200px;outline:none;color:var(--text)}
.search:focus{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease,box-shadow .12s ease;display:flex;flex-direction:column}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.card .thumb{aspect-ratio:16/9;background:var(--soft);border-bottom:1px solid var(--line);overflow:hidden}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .body h3{margin:0;font-size:14.5px;font-weight:600}
.card .attrs{color:var(--muted);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:var(--soft);border-radius:999px;padding:2px 8px;font-size:11.5px;color:var(--muted)}
.tag.tier{background:color-mix(in srgb,var(--accent) 18%,transparent);color:#0f766e}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}

/* detail */
.detail{display:none;height:100%;flex-direction:column}
.detail.on{display:flex}
.grid-view.on{display:block}
.grid-view{display:none}
.dbar{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:2}
.back{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.back:hover{border-color:var(--muted)}
.dbar h2{margin:0;font-size:16px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px;flex:none}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.dbody{padding:20px 22px 40px;overflow:auto;flex:1}
.shot{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:8px;box-shadow:var(--shadow)}
.shot img{display:block;width:100%;height:auto;border-radius:10px;cursor:zoom-in}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:14px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.mcard h3{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:500}
.mcard ol{margin:0;padding-left:18px}
.mcard code{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.warn{color:#d97706}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out}
.lb img{max-width:96vw;max-height:94vh;border-radius:6px}

.stylePanel{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stylePanel h3{margin:0 0 8px;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.stylePanel pre,.stylePanel .md{white-space:pre-wrap;font:13px/1.55 ui-sans-serif,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);max-height:420px;overflow:auto;background:var(--soft);border-radius:12px;padding:12px 14px;margin:0}
.stylePanel .hint{color:var(--muted);font-size:12px;margin-bottom:8px}

.hidden{display:none !important}
</style>
</head>
<body>
<aside>
  <div class="brand">
    <div class="mark"></div>
    <b>Design Library</b>
    <small>本机产品真实界面 · 第一梯队</small>
  </div>
  <div class="apps" id="apps"></div>
  <div class="foot" id="foot"></div>
</aside>

<main>
  <section class="grid-view on" id="gridView">
    <div class="view">
      <div class="top">
        <div>
          <h1 id="appTitle">选择应用</h1>
          <div class="sub" id="appSub"></div>
        </div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <div class="filters" id="groups"></div>
          <input class="search" id="q" placeholder="搜索页面 / 标签…">
        </div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="empty hidden" id="empty">没有匹配的页面</div>
    </div>
  </section>

  <section class="detail" id="detailView">
    <div class="dbar">
      <button class="back" id="back" type="button">← 返回网格</button>
      <h2 id="dTitle"></h2>
      <div class="actions">
        <button class="btn" id="prev" type="button">上一张</button>
        <button class="btn" id="next" type="button">下一张</button>
        <a class="btn" id="full" target="_blank" rel="noopener">打开 4K 原图</a>
      </div>
    </div>
    <div class="dbody">
      <div class="shot"><img id="img" alt=""></div>
      <div class="meta" id="meta"></div>
      <div class="stylePanel" id="stylePanel"></div>
    </div>
  </section>
</main>

<div class="lb" id="lb"><img id="lbimg" alt=""></div>
<script src="screens-data.js"></script>
<script src="style-guides.js"></script>
<script src="config.js"></script>
<script>
const D = window.SCREENS || {apps:[], entries:[]};
const BASE = (window.IMG_BASE !== undefined) ? window.IMG_BASE : "../";
const FULL = (window.FULL_BASE !== undefined) ? window.FULL_BASE : BASE;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let appSlug = null, group = "全部", cur = null, list = [];

function pageSection(md, screen){
  if (!md) return "";
  const lines = md.split(/\r?\n/);
  const keys = [screen, screen.replace(/-/g," ")];
  let start = -1;
  for (let i=0;i<lines.length;i++){
    const L = lines[i];
    if (!L.startsWith("## ")) continue;
    const title = L.slice(3);
    if (keys.some(k => title.toLowerCase().includes(String(k).toLowerCase()))) { start = i; break; }
  }
  if (start < 0) {
    // DNA excerpt: from start until first ## 二 or second ## 
    const cut = md.split(/\n## 二/)[0] || md.slice(0, 1800);
    return cut.trim();
  }
  let end = lines.length;
  for (let i=start+1;i<lines.length;i++){
    if (lines[i].startsWith("## ")) { end = i; break; }
  }
  return lines.slice(start, end).join("\n").trim();
}
function renderStyle(e){
  const md = (window.STYLE_GUIDES||{})[e.slug] || "";
  const panel = $("#stylePanel");
  if (!md) { panel.innerHTML = `<h3>风格分析</h3><div class="hint">暂无 STYLE-GUIDE（apps/${esc(e.slug)}/STYLE-GUIDE.md）</div>`; return; }
  const sec = pageSection(md, e.screen);
  const path = `apps/${e.slug}/STYLE-GUIDE.md`;
  panel.innerHTML = `
    <h3>风格分析 <a class="btn" style="font-weight:500" href="../${path}" target="_blank" rel="noopener">打开完整 STYLE-GUIDE</a></h3>
    <div class="hint">来源级总文档 · 下方优先展示与本页匹配的分节；未匹配则展示产品 DNA 摘要。完整色板/组件通则见全文。</div>
    <div class="md">${esc(sec)}</div>`;
}


function appEntries(slug){ return D.entries.filter(e => e.slug === slug); }
function groupsFor(slug){
  const set = new Set(appEntries(slug).map(e => e.group));
  return ["全部", ...["主要页面","菜单与弹层","设置"].filter(g => set.has(g))];
}

function renderApps(){
  $("#apps").innerHTML = D.apps.map(a => {
    const n = appEntries(a.slug).length;
    const av = a.slug === "grok-bot" ? "gb" : "cx";
    const letter = (a.name || a.slug).slice(0,1);
    return `<div class="app ${a.slug===appSlug?'on':''}" data-a="${a.slug}">
      <div class="av ${av}">${esc(letter)}</div>
      <div class="meta"><b>${esc(a.name)}</b><span>${n} 个页面</span></div>
      <span class="badge">${n}</span>
    </div>`;
  }).join("");
  $("#apps").querySelectorAll(".app").forEach(el => el.onclick = () => selectApp(el.dataset.a));
  $("#foot").textContent = `${D.entries.length} 页 · ${D.generated_at ? D.generated_at.slice(0,16).replace("T"," ") : ""}`;
}

function selectApp(slug, opts={}){
  appSlug = slug; group = "全部"; $("#q").value = "";
  renderApps();
  const a = D.apps.find(x => x.slug === slug);
  $("#appTitle").textContent = a ? a.name : slug;
  $("#appSub").textContent = `${appEntries(slug).length} 个页面 · 点卡片查看大图与元数据`;
  const gs = groupsFor(slug);
  $("#groups").innerHTML = gs.map(g => `<button class="chip ${g===group?'on':''}" data-g="${g}" type="button">${esc(g)}</button>`).join("");
  $("#groups").querySelectorAll(".chip").forEach(b => b.onclick = () => { group = b.dataset.g; renderGrid(); });
  renderGrid();
  if (!opts.keepDetail) showGrid(true);
  if (!opts.skipHash) history.replaceState({view:"grid", app:slug}, "", `#${slug}`);
}

function renderGrid(){
  const q = $("#q").value.trim().toLowerCase();
  list = appEntries(appSlug).filter(e => {
    if (group !== "全部" && e.group !== group) return false;
    if (!q) return true;
    return [e.label,e.screen,e.layout,e.nav,e.notes,...(e.tags||[])].join(" ").toLowerCase().includes(q);
  });
  $("#grid").innerHTML = list.map(e => {
    const attrs = [e.layout, e.nav].filter(Boolean).join(" · ");
    return `<article class="card" data-id="${e.id}">
      <div class="thumb"><img loading="lazy" src="${BASE}${e.shot_ai}" alt=""></div>
      <div class="body">
        <h3>${esc(e.label)}</h3>
        <div class="tags"><span class="tag tier">${esc(e.tier)}</span>${(e.tags||[]).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
        <div class="attrs">${esc(attrs)}</div>
      </div>
    </article>`;
  }).join("");
  $("#empty").classList.toggle("hidden", list.length > 0);
  $("#grid").querySelectorAll(".card").forEach(c => c.onclick = () => openDetail(c.dataset.id));
}

function showGrid(push){
  $("#gridView").classList.add("on");
  $("#detailView").classList.remove("on");
  cur = null;
  if (push && appSlug) history.pushState({view:"grid", app:appSlug}, "", `#${appSlug}`);
}

function openDetail(id, opts={}){
  cur = D.entries.find(e => e.id === id);
  if (!cur) return;
  if (cur.slug !== appSlug) selectApp(cur.slug, {keepDetail:true, skipHash:true});
  list = appEntries(appSlug).filter(e => {
    const q = $("#q").value.trim().toLowerCase();
    if (group !== "全部" && e.group !== group) return false;
    if (!q) return true;
    return [e.label,e.screen,e.layout,e.nav,e.notes,...(e.tags||[])].join(" ").toLowerCase().includes(q);
  });
  if (!list.find(e => e.id === id)) { group = "全部"; $("#q").value = ""; renderGrid(); list = appEntries(appSlug); }

  $("#gridView").classList.remove("on");
  $("#detailView").classList.add("on");
  $("#dTitle").textContent = `${cur.app} · ${cur.label}`;
  $("#img").src = BASE + cur.shot_ai;
  $("#full").href = FULL + cur.shot_full;
  $("#meta").innerHTML = `
    <div class="mcard"><h3>标签</h3><div class="tags"><span class="tag tier">tier: ${esc(cur.tier)}</span>${(cur.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div></div>
    <div class="mcard"><h3>布局 / 导航</h3><div>${esc(cur.layout)}</div><div style="color:var(--muted);margin-top:4px">${esc(cur.nav)}</div></div>
    <div class="mcard"><h3>自动化点击轨迹 (UIA)</h3><ol>${(cur.clicks||[]).map(c=>`<li><code>${esc(c)}</code></li>`).join("") || "<li>—</li>"}</ol></div>
    <div class="mcard"><h3>备注</h3><div>${esc(cur.notes)}</div>
      <div style="color:var(--muted);margin-top:6px;font-size:12px"><code>${esc(cur.id)}</code> · ${esc(cur.full_px)} · AI ${esc(cur.ai_px)} (${Math.round((cur.bytes_ai||0)/1024)} KB)</div>
      ${cur.privacy?`<div class="warn" style="margin-top:6px">⚠ ${esc(cur.privacy)}</div>`:""}
    </div>`;
  renderStyle(cur);
  if (!opts.skipHash) history.pushState({view:"detail", app:appSlug, id}, "", `#${id}`);
}

function step(d){
  if (!list.length || !cur) return;
  const i = list.findIndex(e => e.id === cur.id);
  openDetail(list[(i + d + list.length) % list.length].id);
}

$("#back").onclick = () => { showGrid(true); };
$("#prev").onclick = () => step(-1);
$("#next").onclick = () => step(1);
$("#q").oninput = () => { if ($("#detailView").classList.contains("on")) showGrid(false); renderGrid(); };
$("#img").onclick = () => { $("#lbimg").src = FULL + cur.shot_full; $("#lb").style.display = "flex"; };
$("#lb").onclick = () => { $("#lb").style.display = "none"; };

window.addEventListener("popstate", () => {
  const h = decodeURIComponent(location.hash.slice(1) || "");
  route(h, true);
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "Escape") {
    if ($("#lb").style.display === "flex") { $("#lb").style.display = "none"; return; }
    if ($("#detailView").classList.contains("on")) { history.back(); }
  }
  if ($("#detailView").classList.contains("on")) {
    if (e.key === "ArrowRight" || e.key === "j") step(1);
    if (e.key === "ArrowLeft" || e.key === "k") step(-1);
  }
});

function route(h, fromPop){
  if (!h) {
    if (D.apps[0]) selectApp(D.apps[0].slug, {skipHash:true});
    return;
  }
  if (h.includes("/")) {
    const e = D.entries.find(x => x.id === h);
    if (e) { selectApp(e.slug, {keepDetail:true, skipHash:true}); openDetail(e.id, {skipHash:true}); return; }
  }
  const a = D.apps.find(x => x.slug === h);
  if (a) { selectApp(a.slug, {skipHash:fromPop}); return; }
  if (D.apps[0]) selectApp(D.apps[0].slug, {skipHash:true});
}

renderApps();
route(decodeURIComponent(location.hash.slice(1) || ""));
</script>
</body>
</html>
